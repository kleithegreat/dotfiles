source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

auth {
    fingerprint {
        enabled = true
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
    animation = inputFieldColors, 1, 3, ease
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 10
    brightness = 0.55
    vibrancy = 0.2
}

# Widgets sort by zindex with an unstable sort, so the card must not tie with
# what it sits behind.
shape {
    monitor =
    size = 460, 370
    rounding = 24
    color = $theme_bg_rgba
    border_size = 1
    border_color = $theme_bg2
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = Hi, $USER
    color = $theme_fg
    font_size = 14
    font_family = $theme_sys_font
    position = 0, 122
    halign = center
    valign = center
    zindex = 1
}

# Mono keeps the digits from reflowing the clock every minute.
label {
    monitor =
    text = $TIME
    color = $theme_fg
    font_size = 88
    font_family = $theme_font
    position = 0, 52
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $theme_fg
    font_size = 16
    font_family = $theme_sys_font
    position = 0, -23
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $theme_accent
    inner_color = $theme_bg1
    font_color = $theme_fg
    check_color = $theme_accent
    fail_color = $theme_red
    # Unset, this falls back to fail_color and caps lock reads as a bad password.
    capslock_color = $theme_yellow
    fade_on_empty = false
    font_family = $theme_sys_font
    placeholder_text = <i>Password</i>
    check_text = <i>Checking…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 10
    position = 0, -103
    halign = center
    valign = center
    zindex = 1
}
